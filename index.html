<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#1b1d20; --panel:#222529; --panel2:#272a2f; --line:#33373d; --line2:#2b2e33;
  --text:#e7e8ea; --muted:#8d9399; --dim:#5f656c;
  --yellow:#FFCC33; --yellow2:#EFDF00; --ink:#16181a;
  --warn:#ff9f43; --bad:#ff5d5d; --ok:#3dba74;
  --sans:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* topo */
.top{position:relative;background:#141414;border-bottom:3px solid var(--yellow);padding:0 20px}
.topbar{display:flex;flex-wrap:nowrap;align-items:center;gap:18px;min-height:78px}
.logo{flex:0 0 auto;display:flex;align-items:center;gap:9px}
.logo .dia{height:46px;width:auto;display:block}
.logo .wm{height:16px;width:auto;display:block}
.divider{flex:0 0 auto;width:2px;align-self:stretch;background:#2e2e2e;margin:16px 0}
.brand{flex:1 1 auto;min-width:0;padding:8px 0}
.brand h1{margin:0;font-size:clamp(17px,3.4vw,33px);font-weight:800;letter-spacing:1.2px;line-height:1.04;text-transform:uppercase}
.brand h1 .hl{color:var(--yellow)}
.brand .sub{color:#9a9a9a;font-size:clamp(8.5px,1.5vw,11.5px);font-weight:600;letter-spacing:clamp(1px,.5vw,3px);margin-top:7px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .meta{color:var(--muted);font-size:12.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){
  .top{padding:0 12px}
  .hdr-actions{position:absolute;top:10px;right:12px;padding:0}
  .btn-sync{padding:6px 12px;font-size:13px}
  .sync-note{display:none}
  .topbar{gap:11px;min-height:62px}
  .logo .dia{height:34px}
  .logo .wm{height:12px}
  .divider{display:none}
  .brand h1{letter-spacing:.5px;line-height:1.1}
  .brand .sub{letter-spacing:.5px}
}
@media (max-width:380px){ .logo .dia{height:30px} .logo .wm{height:11px} }
.hdr-actions{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:8px 0}
.btn-sync[hidden]{display:none}
.btn-sync{display:inline-flex;align-items:center;gap:7px;background:var(--yellow);color:var(--ink);border:0;padding:8px 16px;border-radius:3px;font-weight:800;letter-spacing:.4px;cursor:pointer;white-space:nowrap}
.btn-sync:hover{filter:brightness(1.05)}
.btn-sync:disabled{opacity:.6;cursor:progress}
.btn-sync .sp{width:13px;height:13px;border:2px solid rgba(0,0,0,.35);border-top-color:var(--ink);border-radius:50%;display:none}
.btn-sync.loading .sp{display:inline-block;animation:spin .7s linear infinite}
.btn-sync.loading .lbl::after{content:"…"}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-note{font-size:11px;color:var(--muted);white-space:nowrap}
.sync-note.ok{color:#4fd38a}.sync-note.err{color:#ff8585}
.pend-badge{display:none;background:transparent;border:1px solid var(--warn);color:var(--warn);padding:5px 12px;border-radius:3px;cursor:pointer;font-weight:600}
.pend-badge.show{display:inline-block}
.tabs{display:flex;gap:2px;padding:14px 24px 0;border-bottom:2px solid var(--yellow)}
.tab{background:var(--panel);border:0;padding:10px 22px;font-weight:700;letter-spacing:.6px;color:var(--muted);cursor:pointer;border-radius:3px 3px 0 0}
.tab[aria-selected="true"]{background:var(--yellow);color:var(--ink)}
.tab:hover:not([aria-selected="true"]){color:var(--text)}
.view{display:none;padding:18px 24px 40px}
.view.on{display:block}

/* barra de filtros */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input[type=search],.bar select,.fld{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 10px;min-width:150px}
.bar input[type=search]{min-width:260px}
.bar .count{margin-left:auto;color:var(--muted)}
.bar .count b{color:var(--text);font-size:17px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--yellow)}
.btn.pri{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.btn.danger{border-color:#5a2b2b;color:#ff8a8a}
.btn.sm{padding:4px 10px;font-size:13px}

/* tabela TOTAL (estilo da referência) */
.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 240px);border:1px solid var(--line);border-radius:3px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
.grid th{position:sticky;top:0;z-index:3;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.5px;text-align:left;padding:10px 12px;border-right:1px solid rgba(0,0,0,.12);white-space:nowrap}
.grid th.c,.grid td.c{text-align:center}
.grid td{padding:11px 12px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);font-size:14px;white-space:nowrap;background:var(--bg)}
.grid tbody tr:hover td:not(.span){background:#202327}
.grid td.span{vertical-align:top;font-weight:700;letter-spacing:.3px}
.grid td.span .stk{position:sticky;top:44px}
.grid td.praca{border-left:3px solid currentColor;font-size:15px;min-width:130px}
.grid td.fam{font-size:14px;min-width:110px}
.mono{font-family:var(--mono);font-size:12.5px}
.grid td.cor{font-size:12px;letter-spacing:.3px;text-align:center}
.grid td.muted{color:var(--muted)}
.grid tr.tot td{background:#1f2124;font-weight:700;letter-spacing:.6px;font-size:14px;cursor:pointer;border-left:3px solid currentColor;padding:9px 14px}
.grid tr.tot td:hover{background:#25282c}
.flag{color:var(--warn);font-family:var(--mono);font-size:12.5px}
.flag::before{content:"⚠ ";font-family:var(--sans)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.4px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.disp{background:rgba(61,186,116,.14);color:#4fd38a;border:1px solid rgba(61,186,116,.4)}
.pill.resv{background:rgba(255,93,93,.14);color:#ff8585;border:1px solid rgba(255,93,93,.45);cursor:help}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.grid tr.isresv td:not(.span){background:rgba(255,93,93,.05)}
.grid tr.isresv:hover td:not(.span){background:rgba(255,93,93,.09)}
.resbtn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.resbtn:hover{border-color:var(--yellow)}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0}
.chip b{color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--yellow);border-radius:4px;max-width:460px;width:100%;padding:22px 24px}
.modal h3{margin:0 0 4px;font-size:19px}
.modal .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.modal .veh{background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:10px 12px;margin-bottom:16px;font-size:13.5px;line-height:1.7}
.modal .veh b{color:var(--text)}
.modal .veh .mono{font-size:12.5px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.modal .fld{width:100%;min-width:0}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.modal .merr{color:var(--bad);font-size:13px;min-height:1.1em;margin-top:8px}

/* RESUMO */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.strip .cell{background:var(--panel);padding:14px 18px 16px;border-top:3px solid var(--c,var(--yellow))}
.strip .cell .lb{font-weight:700;letter-spacing:.6px;color:var(--c,var(--yellow));font-size:14px}
.strip .cell .n{font-size:42px;font-weight:800;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.strip .cell .s{color:var(--muted);font-size:13px}
.strip .bar2{height:4px;background:var(--line);margin-top:10px;border-radius:2px;overflow:hidden}
.strip .bar2 i{display:block;height:100%;background:var(--c,var(--yellow))}
.rgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1100px){.rgrid{grid-template-columns:1fr}}
.panel h2{font-size:17px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:12px}
.panel h2 .btn{margin-left:auto}
table.mx{border-collapse:separate;border-spacing:0;width:100%;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.mx th{background:var(--yellow);color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.5px;padding:9px 12px;text-align:center;white-space:nowrap}
.mx th:first-child{text-align:left}
.mx td{padding:8px 12px;border-bottom:1px solid var(--line2);text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.mx td:first-child{text-align:left}
.mx tr.famrow td{font-weight:700;background:#202226;cursor:pointer}
.mx tr.famrow td:first-child{letter-spacing:.4px}
.mx tr.ver td{font-size:13.5px}
.mx tr.ver td:first-child{padding-left:30px;color:#c9ccd0}
.mx td.t{font-weight:800;border-left:1px solid var(--line)}
.mx tr.gt td{background:var(--panel2);font-weight:800;border-top:2px solid var(--yellow);letter-spacing:.4px}
.mx .z{color:var(--dim)}
.mx .code{color:var(--muted);font-family:var(--mono);font-size:11.5px;margin-left:6px}
.caret{display:inline-block;width:14px;color:var(--muted)}

/* AJUSTES */
.lock{max-width:380px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--yellow);padding:26px;border-radius:3px}
.lock h2{margin:0 0 6px;font-size:20px}
.lock p{color:var(--muted);margin:0 0 16px}
.lock .row{display:flex;gap:8px}
.lock input{flex:1}
.lock .err{color:var(--bad);margin-top:10px;min-height:1.2em;font-size:14px}
.adj{display:grid;gap:22px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px 20px}
.box h3{margin:0 0 4px;font-size:18px}
.box .help{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:80ch}
.box.warn{border-left:3px solid var(--warn)}
.drop{border:1.5px dashed var(--line);border-radius:3px;padding:26px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--yellow);color:var(--text)}
.drop b{color:var(--yellow)}
.info{margin-top:12px;font-size:14px;color:var(--muted)}
.info b{color:var(--text)}
table.ed{border-collapse:collapse;width:100%}
.ed th{text-align:left;font-size:12px;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.ed td{padding:5px 8px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}
.ed input.fld{width:100%;min-width:0;padding:5px 8px}
.ed .sug{color:var(--muted);font-size:12px;margin-top:3px}
.cads{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:18px;align-items:start}
@media (max-width:1200px){.cads{grid-template-columns:1fr}}
.cad h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.cad h4 small{color:var(--muted);font-weight:500}
.cad .scroll{max-height:420px;overflow:auto;border:1px solid var(--line2);border-radius:3px}
.cad .add{display:flex;gap:6px;margin-bottom:8px}
.cad .add input{flex:1;min-width:0}
.cad .filter{width:100%;margin-bottom:8px}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 6px}
.x:hover{color:var(--bad)}
.vform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.vform label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.vform .fld{width:100%;min-width:0}
.vform .orig{font-size:12px;color:var(--dim);margin-top:3px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--yellow);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:3px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:640px){
  html,body{font-size:14px}
  .view{padding:14px 12px 40px}
  .tabs{padding:12px 12px 0;overflow-x:auto}
  .tab{padding:9px 16px;white-space:nowrap}
  .bar{gap:8px}
  .bar input[type=search]{min-width:100%;order:-1}
  .bar select,.bar .btn{flex:1 1 46%;min-width:0}
  .bar .count{flex-basis:100%;margin-left:0}
  .tablewrap{max-height:none}
  table.grid{min-width:860px}
  .rgrid{gap:14px}
  .rdir{grid-template-columns:1fr}
  .cads{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .strip .cell .n{font-size:32px}
  .lock{margin:40px auto;max-width:100%}
  .modal{padding:12px;align-items:flex-end}
  .modal .card{max-width:100%;border-radius:10px 10px 4px 4px}
  .vform{grid-template-columns:1fr}
  .rowflex .fld{min-width:0;flex:1 1 100%}
}
</style>
</head>

function resolve(r){
  const c = DB.cfg, ov = c.overrides[r.chassi] || {};
  const kConta = norm(r.conta), kVer = norm(r.versao), kCor = norm(r.cor);
  const mPraca = Object.prototype.hasOwnProperty.call(c.contas,kConta) ? c.contas[kConta] : null;
  const mVer = c.versoes[kVer] || null, mCor = c.cores[kCor] || null;
  const modelo = ov.modelo || (mVer ? strip(mVer) : "");
  const familia = ov.familia || norm(r.modelo) || (modelo ? modelo.split(" ")[0] : "SEM FAMÍLIA");
  const y = VIN_YEAR[(r.chassi||"")[9]];
  return {
    ...r,
    praca: ov.praca || mPraca || `SEM PRAÇA (${kConta||"em branco"})`,
    familia, modelo,
    corNome: ov.cor || mCor || "",
    ano: ov.ano || (y ? `${y-1}/${y}` : ""),
    madcF: ov.madc || r.madc || "",
    fConta: !mPraca && !ov.praca, fVer: !mVer && !ov.modelo, fCor: !mCor && !ov.cor,
    ajustado: !!c.overrides[r.chassi],
    reserva: c.reservas[r.chassi] || null
  };
}
function rebuild(){ VEH = DB.rows.map(resolve); }

function pracaOrder(list){
  return [...new Set(list)].sort((a,b)=>{
    const sa=a.startsWith("SEM PRAÇA"), sb=b.startsWith("SEM PRAÇA");
    if(sa!==sb) return sa?1:-1; return a.localeCompare(b,"pt-BR");
  });
}
function pendencias(){
  const map = new Map();
  for(const v of VEH){
    if(v.fConta) add("contas","Conta",norm(v.conta));
    if(v.fVer) add("versoes","Versão",norm(v.versao));
    if(v.fCor) add("cores","Cor",norm(v.cor));
  }
  function add(dict,tipo,code){const k=dict+"|"+code;const o=map.get(k)||{dict,tipo,code,n:0};o.n++;map.set(k,o);}
  return [...map.values()].sort((a,b)=>b.n-a.n);
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q;}
  return p[n];
}
function suggest(dict,code){
  if(dict==="contas") return null;
  let best=null,bd=99;
  for(const k of Object.keys(DB.cfg[dict])){const d=lev(code,k);if(d<bd){bd=d;best=k;}}
  return (best && bd<=2) ? {from:best, value:DB.cfg[dict][best]} : null;
}

function filtered(){
  const q=norm(document.getElementById("fQ").value), p=fPraca.value, f=fFam.value, c=fCor.value;
  return VEH.filter(v=>{
    if(p && v.praca!==p) return false;
    if(f && v.familia!==f) return false;
    if(c && (v.corNome||norm(v.cor))!==c) return false;
    const st=document.getElementById("fStatus").value;
    if(st==="resv" && !v.reserva) return false;
    if(st==="disp" && v.reserva) return false;
    if(q){ const hay=[v.chassi,v.modelo,v.versao,v.opcoes,v.familia,v.corNome,v.cor,v.praca].join(" ").toUpperCase(); if(!hay.includes(q)) return false; }
    return true;
  });

function sortVeh(list){
  const ord = pracaOrder(list.map(v=>v.praca));
  return [...list].sort((a,b)=> ord.indexOf(a.praca)-ord.indexOf(b.praca)
    || a.familia.localeCompare(b.familia) || (a.modelo||a.versao).localeCompare(b.modelo||b.versao)
    || (a.corNome||a.cor).localeCompare(b.corNome||b.cor) || a.chassi.localeCompare(b.chassi));
}

function renderResumo(){
  const rz = document.getElementById("v-resumo");
  let em = document.getElementById("resEmpty");
  if(!em){ em=document.createElement("div"); em.id="resEmpty"; em.className="empty"; em.textContent="Nenhuma planilha importada ainda. Abra a aba AJUSTES e importe o relatório de veículos."; rz.prepend(em); }

  if(!VEH.length) return;
  const pr = pracaOrder(VEH.map(v=>v.praca)), tot = VEH.length;
  const by = (keyFn) => { const m=new Map(); for(const v of VEH){const k=keyFn(v);if(!m.has(k))m.set(k,{});const o=m.get(k);o[v.praca]=(o[v.praca]||0)+1;o.__t=(o.__t||0)+1;} return m; };
  const cntP = {}; VEH.forEach(v=>cntP[v.praca]=(cntP[v.praca]||0)+1);
  const resv = VEH.filter(v=>v.reserva).length, disp=tot-resv;
  let s = `<div class="cell" style="--c:#e7e8ea"><div class="lb">TOTAL A FATURAR</div><div class="n">${tot}</div><div class="s">${pr.length} praça${pr.length===1?"":"s"}</div><div class="bar2"><i style="width:100%"></i></div></div>`;
  s += `<div class="cell" style="--c:#4fd38a"><div class="lb">DISPONÍVEIS</div><div class="n">${disp}</div><div class="s">${tot?Math.round(disp/tot*100):0}% do total</div><div class="bar2"><i style="width:${tot?disp/tot*100:0}%"></i></div></div>`;
  s += `<div class="cell" style="--c:#ff8585"><div class="lb">RESERVADOS</div><div class="n">${resv}</div><div class="s">${tot?Math.round(resv/tot*100):0}% do total</div><div class="bar2"><i style="width:${tot?resv/tot*100:0}%"></i></div></div>`;
  for(const p of pr){ const n=cntP[p], rp=VEH.filter(v=>v.praca===p&&v.reserva).length, pc=tot?Math.round(n/tot*100):0;
    s += `<div class="cell" style="--c:${pracaColor(p)}"><div class="lb">${esc(p)}</div><div class="n">${n}</div><div class="s">${pc}% · ${rp} reservado${rp===1?"":"s"}</div><div class="bar2"><i style="width:${pc}%"></i></div></div>`; }
  document.getElementById("strip").innerHTML = s;

  const famM = by(v=>v.familia), verM = by(v=>v.familia+"||"+(v.modelo||("⚠ "+v.versao)));
  const colMax = m => Object.fromEntries(pr.map(p=>[p,Math.max(1,...[...m.values()].map(o=>o[p]||0))]));
  const heat = (n,p,mx) => n ? `<td style="background:${rgba(pracaColor(p), 0.06 + 0.44*n/mx[p])}">${n}</td>` : `<td class="z">–</td>`;
  const mxV = colMax(verM);
  const cell = (n,p) => heat(n,p,mxV);
  const head = `<tr><th>MODELO</th>${pr.map(p=>`<th>${esc(p)}</th>`).join("")}<th>TOTAL</th></tr>`;
  let h = head;
  const fams = [...famM.entries()].sort((a,b)=>b[1].__t-a[1].__t);
  for(const [f,o] of fams){
    const open = showVersions ? !famOpen.has("x:"+f) : famOpen.has(f);
    h += `<tr class="famrow" data-fam="${esc(f)}"><td style="color:${famColor(f)}"><span class="caret">${open?"▾":"▸"}</span>${esc(f)}</td>${pr.map(p=>o[p]?`<td>${o[p]}</td>`:`<td class="z">–</td>`).join("")}<td class="t">${o.__t}</td></tr>`;
    if(open){
      const vers=[...verM.entries()].filter(([k])=>k.startsWith(f+"||")).sort((a,b)=>b[1].__t-a[1].__t);
      for(const [k,vo] of vers){ h += `<tr class="ver"><td>${esc(k.split("||")[1])}</td>${pr.map(p=>cell(vo[p]||0,p)).join("")}<td class="t">${vo.__t}</td></tr>`; }
    }
  }
  h += `<tr class="gt"><td>TOTAL</td>${pr.map(p=>`<td>${cntP[p]}</td>`).join("")}<td class="t">${tot}</td></tr>`;
  document.getElementById("mxModelo").innerHTML = h;

  const corM = by(v=>(v.corNome||"⚠ SEM CADASTRO")+"||"+norm(v.cor));
  const mxC = colMax(corM);
  let c = `<tr><th>COR</th>${pr.map(p=>`<th>${esc(p)}</th>`).join("")}<th>TOTAL</th></tr>`;
  for(const [k,o] of [...corM.entries()].sort((a,b)=>b[1].__t-a[1].__t)){
    const [nome,code]=k.split("||");
    c += `<tr class="ver"><td style="padding-left:12px">${esc(nome)}<span class="code">${esc(code)}</span></td>${pr.map(p=>heat(o[p]||0,p,mxC)).join("")}<td class="t">${o.__t}</td></tr>`;
  }
  c += `<tr class="gt"><td>TOTAL</td>${pr.map(p=>`<td>${cntP[p]}</td>`).join("")}<td class="t">${tot}</td></tr>`;
  document.getElementById("mxCor").innerHTML = c;

}

/* ============ IMPORTAÇÃO ============ */
const normH = s => String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function toISO(v){
  if(v===""||v==null) return "";
  if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:""; }
  if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
  const s=String(v).trim(); let m;
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s))) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return `${m[1]}-${m[2]}-${m[3]}`;
  return "";
}
function parseSheet(buf){
  const wb = XLSX.read(buf,{type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  let hi=-1; for(let i=0;i<Math.min(20,aoa.length);i++){ if(aoa[i].some(c=>normH(c).includes("chassi"))){hi=i;break;} }
  if(hi<0) throw new Error('Não encontrei a coluna "N° chassis" na primeira aba da planilha.');
  const H = aoa[hi].map(normH), find = fn => H.findIndex(fn);
  const ix = { chassi:find(h=>h.includes("chassi")), conta:find(h=>h.includes("destinat")), versao:find(h=>h==="versao"),
    estof:find(h=>h.startsWith("estofamento")), opcoes:find(h=>h.startsWith("opco")), cor:find(h=>h==="cor"),
    madc:find(h=>h.includes("madc")), modelo:find(h=>h==="modelo") };
  const miss = ["versao","cor"].filter(k=>ix[k]<0);
  if(miss.length) throw new Error("Faltam as colunas: "+miss.map(k=>({versao:"Versão",cor:"Cor"}[k])).join(", ")+".");
  const get=(row,k)=>ix[k]<0?"":row[ix[k]];
  const rows=[], seen=new Set();
  for(let i=hi+1;i<aoa.length;i++){
    const row=aoa[i], ch=norm(get(row,"chassi"));
    if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(ch) || seen.has(ch)) continue;
    seen.add(ch);
    rows.push({ chassi:ch, conta:norm(get(row,"conta")), versao:norm(get(row,"versao")), estof:norm(get(row,"estof")),
      opcoes:norm(get(row,"opcoes")), cor:norm(get(row,"cor")), madc:toISO(get(row,"madc")), modelo:norm(get(row,"modelo")) });
  }
  return {rows, semConta: ix.conta<0};
}
function importFile(file){
  const msg = () => document.getElementById("impMsg");
  if(!window.XLSX){ msg().innerHTML = `<span style="color:var(--bad)">A biblioteca de leitura de Excel não carregou. Abra o painel com internet e tente de novo.</span>`; return; }
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const {rows,semConta} = parseSheet(new Uint8Array(rd.result));
      if(!rows.length) throw new Error("Nenhum chassi válido encontrado na planilha.");
      DB.rows = rows; DB.meta = {file:file.name, at:Date.now()}; save(); refresh();
      const p = pendencias().length;
      msg().innerHTML = `<b style="color:var(--ok)">${rows.length} veículos importados de ${esc(file.name)}.</b>` +
        (p?` <span style="color:var(--warn)">${p} código${p>1?"s":""} sem cadastro — destine abaixo.</span>`:"") +
        (semConta?` <span style="color:var(--warn)">A coluna Conta destinatária não veio; todos foram tratados como conta em branco.</span>`:"");
      toast("Planilha importada");
    }catch(err){ msg().innerHTML = `<span style="color:var(--bad)">${esc(err.message)}</span>`; }
  };
  rd.readAsArrayBuffer(file);
}

  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`faturar_config_${new Date().toISOString().slice(0,10)}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);

// Extrai o ID de um arquivo a partir de um link do Drive e monta a URL de download direto.
function driveId(url){
  if(!url) return "";
  let m = url.match(/\/d\/([a-zA-Z0-9_-]{20,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/)
        || url.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{20,}$/.test(url.trim())) return url.trim();
  return "";
}

function fetchBackup(){
  const d = DB.cfg.drive || {};
  if(d.scriptUrl){
    return fetch(d.scriptUrl, {cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  }
  const id = driveId(d.readUrl);
  if(!id) return Promise.reject(new Error("Configure o link do backup na aba AJUSTES."));
  const url = "https://drive.google.com/uc?export=download&id="+id;
  return fetch(url, {cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
}
// Substitui TUDO pela versão do Drive (cadastros, reservas, ajustes e, se houver, a planilha).
function applyBackup(data){
  if(!data || data.vazio) throw new Error("O backup do Drive ainda está vazio.");
  const cfg = data.cfg || (data.versoes ? data : null);
  if(!cfg || !cfg.versoes) throw new Error("Arquivo de backup inválido.");
  DB.cfg = Object.assign(clone(DEFAULT_CFG), cfg);
  if(!DB.cfg.drive) DB.cfg.drive = { readUrl:"", scriptUrl:"" };
  if(Array.isArray(data.rows)) DB.rows = data.rows;
  if(data.meta) DB.meta = data.meta;
  save();
}
function pullFromDrive(opts){
  opts = opts || {};
  const d = DB.cfg.drive || {};
  if(!d.readUrl && !d.scriptUrl){ if(!opts.silent) toast("Nenhum link do Drive configurado"); return Promise.resolve(false); }
  syncBtn(true); syncNote("Buscando no Drive…");
  return fetchBackup().then(data=>{
    const drvKeep = clone(DB.cfg.drive);     // preserva a configuração local do Drive
    applyBackup(data);
    DB.cfg.drive = drvKeep; save();
    refresh(); updateSyncUI();
    syncNote("Atualizado "+fmtNow(new Date()),"ok");
    if(!opts.silent) toast("Dados atualizados a partir do Drive");
    return true;
  }).catch(err=>{
    syncNote("Falha ao atualizar","err");
    if(!opts.silent) toast("Não foi possível ler o Drive: "+err.message);
    return false;
  }).finally(()=>syncBtn(false));
}
function pushToDrive(){
  const d = DB.cfg.drive || {};
  if(!d.scriptUrl){ toast("Configure a URL do Apps Script para enviar"); return; }
  const payload = JSON.stringify({ tipo:"eurovia_faturar_backup", versao:1, at:new Date().toISOString(), cfg:DB.cfg, rows:DB.rows, meta:DB.meta });
  syncNote("Enviando ao Drive…");
  const btn=document.getElementById("btnDrivePush"); if(btn){ btn.disabled=true; btn.dataset.lbl=btn.textContent; btn.textContent="Enviando…"; }
  // text/plain evita o "preflight" de CORS no Apps Script
  fetch(d.scriptUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:payload })
    .then(r=>r.json().catch(()=>({ok:r.ok})))
    .then(res=>{
      if(res && res.ok===false) throw new Error(res.erro||"recusado");
      syncNote("Backup enviado "+fmtNow(new Date()),"ok"); toast("Backup enviado ao Drive");
    })
    .catch(err=>{ syncNote("Falha ao enviar","err"); toast("Não foi possível enviar: "+err.message); })
    .finally(()=>{ if(btn){ btn.disabled=false; btn.textContent=btn.dataset.lbl||"Enviar backup ao Drive"; } });
}

/* ============ GERAL ============ */
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2400); }
function renderMeta(){
  const at = DB.meta.at ? "lida em "+fmtNow(new Date(DB.meta.at)) : "";
  document.getElementById("meta").textContent = VEH.length||DB.meta.at
    ? `Eurovia Renault · ${DB.meta.file||"—"} · ${VEH.length} veículos · ${at}`
    : "Eurovia Renault · nenhuma planilha importada";
  const p = pendencias(), n = p.reduce((s,x)=>s+x.n,0), b=document.getElementById("pendBadge");
  b.classList.toggle("show", p.length>0);
  b.textContent = `⚠ ${p.length} código${p.length===1?"":"s"} sem cadastro (${n} veículo${n===1?"":"s"})`;
}
function refresh(full=true){
  rebuild(); fillFilters(); renderMeta(); renderTotal(); renderResumo();
  if(typeof updateSyncUI==="function") updateSyncUI();
  if(full) renderAjustes(); else datalists();
}
function showTab(t){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id==="v-"+t));
  if(t==="ajustes" && !unlocked) setTimeout(()=>pwd.focus(),0);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.getElementById("pendBadge").onclick = ()=>showTab("ajustes");
["fQ","fPraca","fFam","fCor","fStatus"].forEach(id=>document.getElementById(id).addEventListener("input",renderTotal));
document.getElementById("tbTotal").addEventListener("click",e=>{
  const req=e.target.closest("[data-req]"); if(req){ openReqModal(req.dataset.req); return; }
  const tr=e.target.closest("tr.tot"); if(!tr) return; const p=tr.dataset.praca;
  collapsed.has(p)?collapsed.delete(p):collapsed.add(p); renderTotal();
});
mCancel.onclick = closeModal;
modal.addEventListener("click", e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && modal.classList.contains("on")) closeModal(); });
document.getElementById("btnExpand").onclick = ()=>{
  if(collapsed.size) collapsed.clear(); else pracaOrder(VEH.map(v=>v.praca)).forEach(p=>collapsed.add(p));
  renderTotal();
};
document.getElementById("btnExport").onclick = exportExcel;
document.getElementById("btnVer").onclick = ()=>{ showVersions=!showVersions; famOpen.clear(); renderResumo(); };
document.getElementById("mxModelo").addEventListener("click",e=>{
  const tr=e.target.closest("tr.famrow"); if(!tr) return; const f=tr.dataset.fam, k=showVersions?"x:"+f:f;
  famOpen.has(k)?famOpen.delete(k):famOpen.add(k); renderResumo();
});
function login(){
  let ok=false; try{ ok = btoa(unescape(encodeURIComponent(pwd.value))) === PWD; }catch(e){}
  if(!ok){ pwdErr.textContent="Senha incorreta."; pwd.select(); return; }
  pwdErr.textContent=""; unlocked=true; lock.hidden=true; document.getElementById("adj").hidden=false; renderAjustes();
}
btnLogin.onclick = login;
pwd.onkeydown = e=>{ if(e.key==="Enter") login(); };
document.getElementById("btnSync").onclick = ()=>pullFromDrive();

load(); refresh();
// Busca automática da última versão ao abrir (silenciosa; se falhar, mantém o que está salvo localmente)
if(DB.cfg.drive && (DB.cfg.drive.scriptUrl || DB.cfg.drive.readUrl)){
  pullFromDrive({silent:true});
}
